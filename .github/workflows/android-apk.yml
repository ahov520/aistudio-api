name: Android APK
on:
  push:
    branches: [android-app]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ] || [ ! -x "$sdk/build-tools/35.0.0/aapt2" ]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            test -x "$manager"
            "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/aapt2"
      - run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: studio-mobile-client-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  embedded:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ] || [ ! -x "$sdk/build-tools/35.0.0/aapt2" ]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            test -x "$manager"
            "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/aapt2"
      - name: Cross-compile pydantic-core for Android
        env:
          CIBW_PLATFORM: android
          CIBW_ARCHS: arm64_v8a
          CIBW_BUILD: cp313-android_arm64_v8a
          CIBW_TEST_SKIP: '*'
          CIBW_ENVIRONMENT_ANDROID: "ANDROID_API_LEVEL=24 MATURIN_PEP517_ARGS=--locked"
        run: |
          rustup target add aarch64-linux-android
          python -m pip install 'cibuildwheel>=3.4,<4'
          mkdir -p "$RUNNER_TEMP/pydantic-src" android/wheels
          curl -fsSL --retry 3 'https://files.pythonhosted.org/packages/71/70/23b021c950c2addd24ec408e9ab05d59b035b39d97cdc1130e1bce647bb6/pydantic_core-2.41.5.tar.gz' -o "$RUNNER_TEMP/pydantic-core.tar.gz"
          echo "08daa51ea16ad373ffd5e7606252cc32f07bc72b28284b6bc9c6df804816476e  $RUNNER_TEMP/pydantic-core.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pydantic-core.tar.gz" -C "$RUNNER_TEMP/pydantic-src" --strip-components=1
          python -m cibuildwheel --output-dir android/wheels "$RUNNER_TEMP/pydantic-src"
          ls -lh android/wheels
      - run: gradle -p android -Pembedded=true :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: studio-mobile-local-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
